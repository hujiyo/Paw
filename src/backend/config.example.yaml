# Paw 配置示例。复制为实际配置后填写。
# 实际配置文件位于用户数据目录（由 Electron 通过 PAW_CONFIG_DIR 指定），
# 不会进入仓库，也不要提交任何真实密钥。
identity:
  name: Paw
  username: hujiyo
  honey: 老公
api:
  key: ""
  url: https://open.bigmodel.cn/api/coding/paas/v4/chat/completions
  model: glm-4.7
  # 接口协议：auto 按 url 推断，也可显式写 openai / anthropic / azure
  style: auto
  temperature: 0.7
  # 输出上限。推理类模型会被思维链吃掉一部分，建议 8000 以上
  max_tokens: 8192
  # 厂商私有字段，原样并入请求体，例如 {"thinking": {"type": "enabled"}}
  extra_body: {}
memory:
  enabled: false
  embedding_url: http://localhost:1234/v1/embeddings
  embedding_key: ""
  embedding_model: text-embedding-qwen3-embedding-0.6b
recall:
  enabled: true
  threshold: 0.36
terminal:
  shell: powershell
  encoding: utf-8
  buffer_size: 24
web:
  search_engine: duckduckgo
  max_results: 5
  page_size: 8192
  use_jina_reader: true
context:
  max_tokens: 64000
  keep_recent_turns: 4
  show_reasoning: true
theme:
  id: yaoye
  titlebar: '#000000'
  loading: '#000000'
  main: '#000000'
  accent: '#FF9E80'
