# Paw 配置示例。复制为实际配置后填写。
# 实际配置文件位于用户数据目录（由 Electron 通过 PAW_CONFIG_DIR 指定），
# 不会进入仓库，也不要提交任何真实密钥。
identity:
  name: Paw
  username: hujiyo
  honey: 老公
api:
  key: ""
  url: https://open.bigmodel.cn/api/coding/paas/v4/chat/completions
  model: glm-4.7
memory:
  enabled: false
  embedding_url: http://localhost:1234/v1/embeddings
  embedding_key: ""
  embedding_model: text-embedding-qwen3-embedding-0.6b
recall:
  enabled: true
  threshold: 0.36
terminal:
  shell: powershell
  encoding: utf-8
  buffer_size: 24
web:
  search_engine: duckduckgo
  max_results: 5
  page_size: 8192
  use_jina_reader: true
context:
  max_tokens: 64000
  keep_recent_turns: 4
theme:
  id: yaoye
  titlebar: '#000000'
  loading: '#000000'
  main: '#000000'
  accent: '#FF9E80'
